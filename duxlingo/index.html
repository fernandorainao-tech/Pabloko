<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3D5AFE">
<title>Duxlingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#F4F6FF; --card:#FFFFFF; --ink:#1B2142; --muted:#5A6185; --soft:#8A90B0; --line:#E3E7F5;
    --pri:#3D5AFE; --pri-d:#2B44D6; --pri-s:#DDE3FF; --coral:#E2504F; --coral-s:#FFE7E6; --sun:#FFC542; --sun-s:#FFF4DA; --sun-t:#B26A00;
    --ok:#1FAE6B; --ok-s:#E3F7EE; --ok-t:#0E6B42; --bad:#E2504F; --bad-s:#FFE7E6; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body { background:var(--bg); color:var(--ink); font-family:'Nunito',system-ui,sans-serif; min-height:100vh; padding-top:env(safe-area-inset-top,0px); }
  h1,h2,h3,h4,.f { font-family:'Fredoka','Nunito',sans-serif; font-weight:600; }
  button { font-family:inherit; cursor:pointer; }
  svg { display:block; }
  .wrap { max-width:640px; margin:0 auto; padding:0 18px 110px; }
  .hidden { display:none !important; }
  /* cabecera */
  .top { display:flex; justify-content:space-between; align-items:center; padding:22px 0 16px; gap:10px; }
  .eye { font-size:12.5px; font-weight:800; letter-spacing:.1em; color:var(--pri); text-transform:uppercase; }
  .ttl { font-size:27px; line-height:1.15; }
  .acts { display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .chip-r { height:44px; padding:0 12px; border-radius:14px; background:var(--sun-s); display:flex; align-items:center; gap:6px; font-weight:800; color:var(--sun-t); }
  .chip-r svg { width:20px; height:20px; }
  .ava { width:44px; height:44px; border-radius:50%; border:2px solid var(--pri); background:var(--pri-s); color:var(--pri); font-family:'Fredoka','Nunito',system-ui,sans-serif; font-weight:700; font-size:17px; }
  .card { background:var(--card); border-radius:20px; padding:16px; box-shadow:0 4px 14px rgba(27,33,66,.06); }
  .stack { display:flex; flex-direction:column; gap:14px; }
  .panel { display:none; } .panel.on { display:block; }
  /* inicio */
  .hero { background:var(--pri); color:#fff; border-radius:24px; padding:18px; display:flex; flex-direction:column; gap:12px; box-shadow:0 10px 24px rgba(61,90,254,.25); }
  .hero small { font-size:13px; font-weight:700; opacity:.85; }
  .hero h2 { font-size:22px; }
  .hero .pill { background:rgba(255,255,255,.18); border-radius:12px; padding:6px 10px; font-weight:800; font-size:13px; white-space:nowrap; }
  .bar { height:10px; border-radius:5px; background:rgba(255,255,255,.25); overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--sun); border-radius:5px; }
  .btn-w { height:52px; border-radius:16px; background:#fff; color:var(--pri); border:none; font-family:'Fredoka','Nunito',system-ui,sans-serif; font-weight:600; font-size:17px; display:flex; align-items:center; justify-content:center; gap:8px; width:100%; }
  .btn-w svg { width:18px; height:18px; }
  .wod { display:flex; align-items:center; gap:14px; }
  .wod .k { font-size:12.5px; font-weight:800; letter-spacing:.08em; color:var(--coral); }
  .wod .w { font-family:'Fredoka','Nunito',system-ui,sans-serif; font-size:26px; font-weight:600; }
  .wod .m { font-size:14px; color:var(--muted); }
  .spk { width:48px; height:48px; border-radius:14px; border:none; background:var(--pri-s); color:var(--pri); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .spk svg { width:22px; height:22px; }
  .spk.coral { background:var(--coral-s); color:var(--coral); width:52px; height:52px; border-radius:16px; }
  .spk.sm { width:42px; height:42px; border-radius:12px; background:var(--bg); }
  .quick { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .quick button { background:#fff; border:none; border-radius:20px; padding:14px; display:flex; flex-direction:column; gap:10px; text-align:left; box-shadow:0 4px 14px rgba(27,33,66,.06); color:var(--ink); }
  .qi { width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center; }
  .qi svg { width:22px; height:22px; }
  .quick b { font-family:'Fredoka','Nunito',system-ui,sans-serif; font-weight:600; font-size:17px; }
  /* lecciones */
  .les { display:flex; align-items:center; gap:14px; width:100%; border:none; text-align:left; color:var(--ink); }
  .les-n { width:52px; height:52px; border-radius:16px; background:var(--pri-s); color:var(--pri); display:flex; align-items:center; justify-content:center; font-family:'Fredoka','Nunito',system-ui,sans-serif; font-size:22px; font-weight:700; flex-shrink:0; }
  .les.done .les-n { background:var(--ok); color:#fff; }
  .les.lock { opacity:.55; }
  .les.lock .les-n { background:#EEF0F8; color:var(--soft); }
  .les h3 { font-size:17px; } .les p { font-size:13.5px; color:var(--muted); margin-top:2px; }
  .les .st { margin-left:auto; font-size:12.5px; font-weight:800; color:var(--soft); white-space:nowrap; }
  .les.done .st { color:var(--ok-t); }
  /* pantalla lección */
  .lhead { background:#fff; margin:0 -18px; padding:18px 18px 14px; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  .lrow { display:flex; align-items:center; gap:12px; }
  .back { width:44px; height:44px; border-radius:14px; background:var(--bg); border:none; color:var(--ink); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .back svg { width:20px; height:20px; }
  .segs { display:flex; gap:8px; margin-top:12px; }
  .segs button { font-size:14px; font-weight:700; padding:8px 14px; border-radius:20px; border:none; background:var(--bg); color:var(--muted); }
  .segs button.on { background:var(--pri); color:#fff; font-weight:800; }
  .sec h3 { font-size:19px; margin:26px 0 10px; }
  .sec p.x { font-size:16px; line-height:1.55; color:#3A4066; margin-bottom:12px; }
  .tip { background:var(--sun-s); border-radius:14px; padding:10px 12px; font-size:14.5px; line-height:1.45; color:#6B4A00; margin-bottom:12px; }
  .wl { background:#fff; border-radius:20px; overflow:hidden; box-shadow:0 4px 14px rgba(27,33,66,.06); }
  .wr { display:flex; align-items:center; gap:12px; padding:10px 12px 10px 16px; border-bottom:1px solid #EEF1FA; }
  .wr:last-child { border-bottom:none; }
  .wr .t { flex:1; min-width:0; }
  .wr b { font-size:16.5px; font-weight:800; }
  .wr .p { font-weight:600; color:var(--soft); font-size:14px; }
  .wr .e { display:block; font-size:14.5px; color:var(--muted); margin-top:1px; }
  .wr.fr b { font-family:'Fredoka','Nunito',system-ui,sans-serif; font-weight:600; font-size:17px; color:var(--pri); }
  .btn { height:56px; border-radius:18px; border:none; background:var(--pri); color:#fff; font-family:'Fredoka','Nunito',system-ui,sans-serif; font-size:18px; font-weight:600; width:100%; box-shadow:0 8px 20px rgba(61,90,254,.25); }
  .btn.ghost { background:#fff; color:var(--pri); box-shadow:none; border:2px solid var(--pri-s); }
  .exam-card { text-align:center; padding:24px 18px; }
  .exam-card h3 { font-size:21px; margin-bottom:8px; }
  .exam-card p { color:var(--muted); font-size:15px; line-height:1.5; margin-bottom:16px; }
  .big { font-family:'Fredoka','Nunito',system-ui,sans-serif; font-size:40px; font-weight:700; color:var(--pri); }
  /* vocabulario */
  .fc { perspective:900px; height:260px; margin:6px 0 14px; }
  .fc-in { position:relative; width:100%; height:100%; transition:transform .45s; transform-style:preserve-3d; cursor:pointer; }
  .fc.flip .fc-in { transform:rotateY(180deg); }
  .fc-f, .fc-b { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:24px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:18px; text-align:center; }
  .fc-f { background:#fff; box-shadow:0 8px 24px rgba(27,33,66,.08); }
  .fc-b { background:var(--pri); color:#fff; transform:rotateY(180deg); }
  .fc-f .w { font-family:'Fredoka','Nunito',system-ui,sans-serif; font-size:34px; font-weight:600; }
  .fc-f .p { color:var(--soft); font-size:16px; }
  .fc-b .w { font-family:'Fredoka','Nunito',system-ui,sans-serif; font-size:28px; font-weight:600; }
  .fc-hint { font-size:13px; color:var(--soft); }
  .fc-b .fc-hint { color:rgba(255,255,255,.75); }
  .fc-btns { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .fc-btns button { height:54px; border-radius:16px; border:none; font-family:'Fredoka','Nunito',system-ui,sans-serif; font-weight:600; font-size:16px; }
  .b-rep { background:var(--coral-s); color:var(--coral); } .b-ok { background:var(--ok-s); color:var(--ok-t); }
  .vstats { display:flex; justify-content:space-between; font-size:14px; color:var(--muted); font-weight:700; }
  /* logros */
  .lg2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .lgs { display:flex; align-items:center; gap:12px; }
  .lgs .qi { flex-shrink:0; }
  .lgs b { display:block; font-family:'Fredoka','Nunito',system-ui,sans-serif; font-size:24px; line-height:1.1; }
  .lgs span { font-size:13px; color:var(--muted); }
  .medals { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px 8px; }
  .md { display:flex; flex-direction:column; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--muted); text-align:center; }
  .md i { width:58px; height:58px; border-radius:50%; background:#EEF0F8; color:#B0B5CC; display:flex; align-items:center; justify-content:center; font-family:'Fredoka','Nunito',system-ui,sans-serif; font-style:normal; font-size:22px; font-weight:700; }
  .md.on i { background:var(--sun); color:#6B4A00; box-shadow:0 4px 0 #E0A800; }
  .prz { display:flex; align-items:center; gap:12px; }
  .prz .qi { flex-shrink:0; }
  .prz .pb { flex:1; min-width:0; }
  .prz .ph { display:flex; justify-content:space-between; gap:8px; }
  .prz .ph b { font-size:15px; } .prz .ph span { font-size:12.5px; font-weight:800; color:var(--soft); white-space:nowrap; }
  .prz.won .ph span { color:var(--ok-t); }
  .prz .pd { font-size:13px; color:var(--muted); margin:2px 0 6px; }
  .pbar { height:8px; border-radius:4px; background:#EEF0F8; overflow:hidden; }
  .pbar i { display:block; height:100%; background:var(--pri); border-radius:4px; }
  .prz.won .pbar i { background:var(--ok); }
  .h2s { font-size:19px; margin:24px 0 10px; }
  /* navegación */
  .nav { position:fixed; left:0; right:0; bottom:0; z-index:40; background:#fff; border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px)); }
  .nav button { background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px; color:#7A80A3; font-size:12px; font-weight:600; padding:6px 0; min-height:52px; }
  .nav button svg { width:22px; height:22px; }
  .nav button.on { color:var(--pri); font-weight:800; }
  /* práctica */
  #quiz { padding-bottom:260px; }
  .qtop { display:flex; align-items:center; gap:12px; padding:18px 0 14px; }
  .qx { width:44px; height:44px; border-radius:14px; background:#fff; border:none; color:var(--muted); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .qx svg { width:18px; height:18px; }
  .qbar { flex:1; height:14px; border-radius:7px; background:var(--pri-s); overflow:hidden; }
  .qbar i { display:block; height:100%; background:var(--pri); border-radius:7px; transition:width .3s; }
  .qn { font-family:'Fredoka','Nunito',system-ui,sans-serif; font-weight:600; color:var(--pri); }
  .qk { font-size:13px; font-weight:800; letter-spacing:.1em; color:var(--coral); margin:6px 0 12px; }
  .qprompt { display:flex; align-items:center; gap:14px; padding:18px; }
  .qprompt .spk { width:56px; height:56px; border-radius:18px; background:var(--pri); color:#fff; }
  .qprompt .spk svg { width:26px; height:26px; }
  .qw { font-family:'Fredoka','Nunito',system-ui,sans-serif; font-size:25px; font-weight:600; line-height:1.2; }
  .qp { font-size:14px; color:var(--soft); }
  .opts { display:flex; flex-direction:column; gap:10px; margin-top:16px; }
  .opt { min-height:56px; padding:12px 16px; border-radius:18px; background:#fff; border:2px solid var(--line); font-weight:700; font-size:16px; color:var(--ink); text-align:left; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .opt.sel { border-color:var(--pri); background:#F1F3FF; }
  .opt.ok { border-color:var(--ok); background:var(--ok-s); color:var(--ok-t); font-weight:800; }
  .opt.bad { border-color:var(--bad); background:var(--bad-s); color:#A33232; }
  .opt:disabled { cursor:default; }
  .check { margin-top:18px; }
  .btn:disabled { background:#D5DAEE; color:#8A90B0; box-shadow:none; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:50; max-width:640px; margin:0 auto; border-radius:26px 26px 0 0; padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:10px; transform:translateY(110%); transition:transform .28s; box-shadow:0 -10px 30px rgba(27,33,66,.12); }
  .sheet.show { transform:none; }
  .sheet.good { background:var(--ok-s); } .sheet.wrong { background:var(--bad-s); }
  .sh-h { display:flex; align-items:center; gap:10px; }
  .sh-ic { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0; }
  .sh-ic svg { width:20px; height:20px; }
  .good .sh-ic { background:var(--ok); } .wrong .sh-ic { background:var(--bad); }
  .sh-t { font-family:'Fredoka','Nunito',system-ui,sans-serif; font-size:21px; font-weight:600; }
  .good .sh-t { color:var(--ok-t); } .wrong .sh-t { color:#A33232; }
  .sh-p { font-size:15px; line-height:1.5; margin-bottom:6px; }
  .good .sh-p { color:#24543F; } .wrong .sh-p { color:#6E2A2A; }
  .sheet .btn { box-shadow:none; }
  .good .btn { background:var(--ok); } .wrong .btn { background:var(--bad); }
  /* resultado */
  .res { text-align:center; padding:40px 0 20px; }
  .res .ring { width:150px; height:150px; margin:0 auto 18px; position:relative; }
  .res .ring b { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Fredoka','Nunito',system-ui,sans-serif; font-size:36px; }
  .res h2 { font-size:26px; margin-bottom:6px; }
  .res p { color:var(--muted); font-size:15.5px; margin-bottom:22px; }
  .toast { position:fixed; left:12px; right:12px; top:calc(12px + env(safe-area-inset-top,0px)); z-index:80; max-width:520px; margin:0 auto; background:var(--sun-s); border:1.5px solid #F2D27A; border-radius:18px; padding:12px 14px; display:flex; align-items:center; gap:12px; box-shadow:0 10px 26px rgba(27,33,66,.15); transition:transform .3s, opacity .3s; }
  .toast.hidden { display:flex !important; transform:translateY(-140%); opacity:0; pointer-events:none; }
  .toast b { font-family:'Fredoka','Nunito',system-ui,sans-serif; font-size:16px; } .toast span { font-size:13px; color:#6B4A00; }
</style>
</head>
<body>
<div class="wrap">
  <!-- ===== APP ===== -->
  <div id="app">
    <div class="top">
      <div><div class="eye" id="eye">Inglés básico</div><h1 class="ttl" id="ttl">Hello, Constanza!</h1></div>
      <div class="acts"><span class="chip-r" title="Días seguidos estudiando"><svg viewBox="0 0 24 24" fill="#FF9F1C"><path d="M12 2c2.5 3.5 6 5.3 6 10.3a6 6 0 0 1-12 0c0-3 1.8-4.8 3-6.5.6 2.3 1.8 3.5 3 3.5 0-2.3-1.2-4.7 0-7.3z"/></svg><span id="racha">0</span></span>
        <button class="ava" id="ava" aria-label="Tus logros">C</button></div>
    </div>
    <div class="panel on" id="p-inicio"><div class="stack" id="inicio"></div></div>
    <div class="panel" id="p-lecciones"><div class="stack" id="lecciones"></div></div>
    <div class="panel" id="p-practica"><div class="stack" id="practica"></div></div>
    <div class="panel" id="p-vocab"><div class="stack" id="vocab"></div></div>
    <div class="panel" id="p-logros"><div class="stack" id="logros"></div></div>
  </div>
  <!-- ===== LECCIÓN ===== -->
  <div id="leccion" class="hidden"></div>
  <!-- ===== QUIZ ===== -->
  <div id="quiz" class="hidden">
    <div class="qtop"><button class="qx" id="qx" aria-label="Salir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="qbar"><i id="qbar"></i></div><span class="qn" id="qn"></span></div>
    <div class="qk" id="qk"></div>
    <div class="card qprompt" id="qprompt"></div>
    <div class="opts" id="opts"></div>
    <button class="btn check" id="qcheck" disabled>Comprobar</button>
  </div>
  <div id="result" class="hidden"></div>
</div>
<div class="sheet" id="sheet"><div class="sh-h"><span class="sh-ic" id="sh-ic"></span><span class="sh-t" id="sh-t"></span></div><p class="sh-p" id="sh-p"></p><button class="btn" id="sh-btn">Continuar</button></div>
<div class="toast hidden" id="toast" role="status"><span class="qi" style="background:var(--sun);color:#6B4A00;width:40px;height:40px;border-radius:50%"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg></span><div><b id="toast-t"></b><br><span id="toast-s"></span></div></div>
<nav class="nav" id="nav" aria-label="Navegación principal">
  <button class="on" data-tab="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Inicio</button>
  <button data-tab="lecciones"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z"/></svg>Lecciones</button>
  <button data-tab="practica"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>Práctica</button>
  <button data-tab="vocab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="13" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>Vocabulario</button>
  <button data-tab="logros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>Logros</button>

function finishQuiz() {
  var pct = Math.round(Q.ok * 100 / Q.qs.length), s = load();
  if (Q.id) { var st = s.les[Q.id] || {}; if (Q.mode === "examen") { st.exam = Math.max(st.exam || 0, pct); if (pct >= 80) st.done = true; } else st.best = Math.max(st.best || 0, pct); s.les[Q.id] = st; }
  save(s);
  el("quiz").classList.add("hidden");
  var msg = pct >= 80 ? (Q.mode === "examen" ? "¡Lección aprobada! Ganaste la medalla." : "¡Excelente ronda!") : pct >= 50 ? "¡Vas bien! Repasa las que fallaste." : "Cada intento suma. ¡Sigue practicando!";
  var C = 2 * Math.PI * 64, d = Math.round(C * pct / 100);
  el("result").innerHTML = '<div class="res"><div class="ring"><svg viewBox="0 0 150 150" width="150" height="150"><circle cx="75" cy="75" r="64" fill="none" stroke="#DDE3FF" stroke-width="14"/><circle cx="75" cy="75" r="64" fill="none" stroke="' + (pct >= 80 ? '#1FAE6B' : '#3D5AFE') + '" stroke-width="14" stroke-linecap="round" stroke-dasharray="' + d + ' ' + C + '" transform="rotate(-90 75 75)"/></svg><b>' + pct + '%</b></div>' +
    '<h2>' + Q.ok + ' de ' + Q.qs.length + ' correctas</h2><p>' + msg + '</p><div class="stack"><button class="btn" id="r-again">Jugar otra vez</button><button class="btn ghost" id="r-home">Volver</button></div></div>';
  el("result").classList.remove("hidden"); window.scrollTo(0, 0);
  el("r-again").onclick = function () { history.replaceState({ v: "quiz" }, ""); startQuiz(Q.id, Q.mode, true); };
  el("r-home").onclick = function () { history.back(); };
  checkPrizes();
}
function exitQuiz() {
  el("quiz").classList.add("hidden"); el("result").classList.add("hidden"); el("sheet").classList.remove("show");
  if (speechSynthesis) speechSynthesis.cancel();
  if (curLesson && !el("leccion").dataset.none && Q && Q.id && history.state && history.state.v === "les") { el("leccion").classList.remove("hidden"); rLesson(); }
  else { el("app").classList.remove("hidden"); el("nav").classList.remove("hidden"); render(curTab); }
}
el("qx").onclick = function () { if (confirm("¿Salir de la práctica? Perderás el avance de esta ronda.")) history.back(); };
// ---------- botón atrás ----------
window.addEventListener("popstate", function (e) {
  var st = e.state || { v: "tab", t: "inicio" };
  var inQuiz = !el("quiz").classList.contains("hidden"), inRes = !el("result").classList.contains("hidden");
  if (inQuiz && !Q.leaving) { if (!confirm("¿Salir de la práctica? Perderás el avance de esta ronda.")) { history.pushState({ v: "quiz" }, ""); return; } }
  if (inQuiz || inRes) { exitQuiz(); if (st.v === "les") { el("app").classList.add("hidden"); el("nav").classList.add("hidden"); el("leccion").classList.remove("hidden"); rLesson(); } return; }
  if (st.v === "les") { openLesson(st.id, curSeg, true); return; }
  if (!el("leccion").classList.contains("hidden")) closeLesson();
  tab(st.t || "inicio", true);
});
history.replaceState({ v: "tab", t: "inicio" }, "");
render("inicio");
checkPrizes();
</script>
</body>
</html>
